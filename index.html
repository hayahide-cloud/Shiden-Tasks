<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Shiden Tasks</title>
<meta name="description" content="AIが補助するタスク管理（Microsoft To Do風・GitHub同期）">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='115' fill='%237c3aed'/%3E%3Cpath d='M296 66 L158 296 L248 296 L212 446 L376 218 L276 218 L336 66 Z' fill='%23facc15'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="紫電Tasks">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#09060f">
<style>
  /* ================================================================
     Shiden Tasks — AI補助タスク管理（Microsoft To Do 風レイアウト・GitHub同期）
     秘密情報は一切含まない。実データは Private の Hayahide-Log に保存。
     GitHubトークン・OpenAI APIキーは各端末のブラウザ内(localStorage)のみ。
     画面構成は MS To Do に倣う: 左サイドバー（スマートリスト＋自作リスト）／中央タスク一覧
     （フラットな行・下部に追加バー・完了の折りたたみ）／右詳細ペイン（下部バーに作成日・削除）。
     配色は Shiden 共通テーマ（ダーク×紫）。
     ================================================================ */
  :root {
    --page: #09060f; --surface: #14101d; --surface-2: #1d1729; --surface-3: #261e35; --row: #171222; --row-hover: #1f1830;
    --ink: #ece5fa; --ink-2: #c4b7dc; --muted: #9b8db8;
    --grid: #2a2140; --border: rgba(168,120,255,0.16);
    --accent: #a06bff; --accent-hi: #c084fc; --accent-deep: #7c3aed;
    --good: #34d399; --bad: #f87171; --warn: #fbbf24;
    --side-w: 250px; --detail-w: 360px; --appbar-h: 48px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { color-scheme: dark; height: 100%; }
  body { height: 100%; background: var(--page); color: var(--ink); font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", sans-serif; line-height: 1.5; -webkit-text-size-adjust: 100%; overflow: hidden; }
  button, input, select, textarea { font-family: inherit; }
  [hidden] { display: none !important; }

  /* ---- アプリバー（MS To Do の最上部バー相当） ---- */
  .shell { height: 100%; display: flex; flex-direction: column; }
  /* iPhone のステータスバー下に潜り込まないよう、高さを安全領域ぶん伸ばす（固定48pxだと中身が潰れて重なる） */
  .appbar { height: calc(var(--appbar-h) + env(safe-area-inset-top, 0px)); flex: none; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 14px; padding-top: env(safe-area-inset-top, 0px); background: var(--surface); border-bottom: 1px solid var(--grid); }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 16px; color: #fff; white-space: nowrap; }
  .brand svg { width: 24px; height: 24px; }
  .brand .g { background: linear-gradient(90deg, #a78bfa, #7c3aed); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .gh-status { font-size: 12px; color: var(--muted); margin-left: 8px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ibtn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; min-width: 32px; padding: 0 10px; border-radius: 6px; border: none; background: transparent; color: var(--ink-2); font-size: 13px; cursor: pointer; }

  /* ---- 設定パネル（アプリバー直下に展開） ---- */
  /* 設定ページ（全画面。アプリの上に重ねる。スマホは右からスライド） */
  .cfg { position: fixed; inset: 0; z-index: 90; background: var(--page); display: flex; flex-direction: column; transform: translateX(100%); visibility: hidden; transition: transform .28s cubic-bezier(.2,.8,.2,1), visibility 0s linear .28s; }
  .cfg.open { transform: none; visibility: visible; transition: transform .28s cubic-bezier(.2,.8,.2,1); }
  .cfg-head { flex: none; height: calc(var(--appbar-h) + env(safe-area-inset-top, 0px)); padding-top: env(safe-area-inset-top, 0px); display: flex; align-items: center; gap: 6px; padding-left: 8px; padding-right: 12px; background: var(--surface); border-bottom: 1px solid var(--grid); font-weight: 600; font-size: 16px; color: #fff; }
  .cfg-head .back { font-size: 22px; }
  .cfg-body { flex: 1; min-height: 0; overflow: auto; padding: 16px; padding-bottom: max(24px, env(safe-area-inset-bottom)); }
  .cfg-inner { max-width: 720px; margin: 0 auto; }
  .cfg h3 { font-size: 14px; color: var(--accent-hi); margin: 18px 0 8px; }
  .cfg h3:first-child { margin-top: 0; }
  .cfg label { font-size: 12px; color: var(--ink-2); display: block; margin: 8px 0; }
  .cfg-grid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .cfg input, .cfg select { width: 100%; font-size: 14px; background: var(--surface-2); color: var(--ink); border: 1px solid var(--border); border-radius: 6px; padding: 9px 11px; }
  .cfg input:focus, .cfg select:focus { outline: none; border-color: var(--accent); }
  .cfg-actions { display: flex; align-items: center; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
  .hint { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
  .ver { font-size: 11px; color: var(--muted); margin-left: 6px; white-space: nowrap; }
  .changelog { margin-top: 6px; font-size: 12.5px; color: var(--ink-2); }
  .changelog li { display: flex; gap: 10px; padding: 4px 0; border-bottom: 1px solid var(--grid); }
  .changelog li:last-child { border-bottom: none; }
  .changelog .v { flex: none; color: var(--accent-hi); font-variant-numeric: tabular-nums; width: 118px; }
  .changelog li.cur .v::after { content: " ●"; color: var(--good); }
  .btn { font-size: 13.5px; font-weight: 600; cursor: pointer; color: #fff; border: none; border-radius: 6px; padding: 9px 16px; background: var(--accent-deep); }
  .linkbtn { font-size: 13px; cursor: pointer; color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 7px 12px; }
  .linkbtn.danger { color: var(--muted); background: transparent; }

  /* ---- 3ペイン ---- */
  /* grid-template-rows を minmax(0,1fr) にしないと、タスクが増えたときにグリッド行が中身に合わせて伸びてページ外に溢れ、スクロールできなくなる */
  /* PC は詳細ペインを常に確保する（未選択時はプレースホルダ）。スマホは has-detail のときだけ重ねる */
  .app { flex: 1; min-height: 0; display: grid; grid-template-columns: var(--side-w) 1fr var(--detail-w); grid-template-rows: minmax(0, 1fr); overflow: hidden; }
  .detail .placeholder { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--muted); font-size: 13px; text-align: center; padding: 20px; }
  .detail .placeholder .big { font-size: 34px; opacity: .6; }

  /* サイドバー */
  .side { background: var(--surface); border-right: 1px solid var(--grid); display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
  .nav { list-style: none; flex: 1; overflow: auto; padding: 8px 6px; }
  .nav li { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 4px; cursor: pointer; color: var(--ink); font-size: 14px; position: relative; }
  .nav li.active { background: var(--surface-3); }
  .nav li.active::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--accent); }
  .nav li .ico { width: 20px; text-align: center; flex: none; font-size: 15px; }
  .nav li .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav li .cnt { font-size: 12px; color: var(--muted); }
  .nav .sep { height: 1px; background: var(--grid); margin: 8px 8px; }
  .newlist-wrap { flex: none; border-top: 1px solid var(--grid); padding: 6px; }
  .newlist-btn { width: 100%; display: flex; align-items: center; gap: 12px; padding: 9px 12px; border: none; background: transparent; color: var(--accent-hi); font-size: 14px; cursor: pointer; border-radius: 4px; text-align: left; }
  .newlist { display: none; gap: 6px; padding: 4px 6px 6px; }
  .side.open .newlist { display: flex; }
  .side.open .newlist-btn { display: none; }
  .newlist input { flex: 1; min-width: 0; font-size: 14px; background: var(--surface-2); color: var(--ink); border: 1px solid var(--accent); border-radius: 4px; padding: 7px 9px; outline: none; }

  /* メイン（タスク一覧） */
  .main { min-width: 0; min-height: 0; display: flex; flex-direction: column; position: relative; }
  .main.myday { background: radial-gradient(900px 320px at 20% -10%, rgba(124,58,237,0.28), transparent 60%), var(--page); }
  .listhead { flex: none; display: flex; align-items: flex-start; gap: 10px; padding: 22px 28px 12px; }
  .listhead .back { display: none; }
  .listhead .tt { flex: 1; min-width: 0; }
  .listhead h2 { font-size: 24px; font-weight: 600; color: #fff; display: flex; align-items: center; gap: 10px; line-height: 1.2; }
  .listhead .date { color: var(--ink-2); font-size: 13px; margin-top: 4px; }
  .menu-wrap { position: relative; }
  .popover { position: absolute; right: 0; top: 36px; z-index: 20; background: var(--surface-2); border: 1px solid var(--grid); border-radius: 6px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); min-width: 170px; padding: 4px; }
  .popover button { display: block; width: 100%; text-align: left; padding: 9px 12px; background: transparent; border: none; color: var(--ink); font-size: 13.5px; border-radius: 4px; cursor: pointer; }
  .popover button.danger { color: var(--bad); }
  .tasks-scroll { flex: 1; min-height: 0; overflow: auto; padding: 0 28px 12px; }
  .tasks { list-style: none; display: flex; flex-direction: column; gap: 2px; }
  .task { display: flex; align-items: center; gap: 14px; background: var(--row); border-radius: 4px; padding: 0 14px; min-height: 52px; cursor: pointer; border: 1px solid transparent; }
  .task.sel { background: var(--surface-3); border-color: rgba(168,120,255,0.35); }
  .task.done .title { text-decoration: line-through; color: var(--muted); }
  .chk { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--ink-2); flex: none; display: grid; place-items: center; font-size: 11px; color: #fff; cursor: pointer; }
  .task.done .chk, .chk.on { background: var(--accent-deep); border-color: var(--accent-deep); }
  .task .body { flex: 1; min-width: 0; padding: 8px 0; }
  .task .title { font-size: 14px; overflow-wrap: anywhere; }
  .task .meta { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 1px; }
  .task .meta span + span::before { content: "•"; margin-right: 6px; opacity: .6; }
  .task .meta .over { color: var(--bad); }
  .task .meta .today { color: var(--accent-hi); }
  .task .meta .aim { color: var(--accent-hi); }
  /* タグ（チャネル＝青系／種別＝緑系／自由＝灰） */
  .tag { display: inline-flex; align-items: center; font-size: 11px; line-height: 1; padding: 3px 7px; border-radius: 999px; border: 1px solid transparent; white-space: nowrap; }
  .tag.ch { background: rgba(56,189,248,0.14); color: #7dd3fc; border-color: rgba(56,189,248,0.3); }
  .tag.ty { background: rgba(52,211,153,0.14); color: #6ee7b7; border-color: rgba(52,211,153,0.3); }
  .tag.fr { background: var(--surface-3); color: var(--ink-2); border-color: var(--grid); }
  .task .meta .tag { margin-right: 2px; }
  .task .meta .tag + .tag::before, .task .meta span + .tag::before, .task .meta .tag + span::before { content: none; margin: 0; }
  .tagbar { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 28px 10px; }
  .tagbar .tag { cursor: pointer; opacity: .55; padding: 5px 10px; font-size: 12px; }
  .tagbar .tag.zero { opacity: .25; }
  .tagbar .sep { width: 1px; background: var(--grid); margin: 2px 2px; }
  .tagbar .tag.on, .tagbar .tag:not(.on):active { opacity: 1; box-shadow: 0 0 0 1px currentColor inset; }
  .tagbar .clear { font-size: 12px; color: var(--muted); background: none; border: none; cursor: pointer; }
  .dtags { padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; }
  .dtags .grp { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .dtags .grp .lbl { width: 52px; flex: none; }
  .dtags .tag { cursor: pointer; opacity: .5; padding: 5px 10px; font-size: 12px; }
  .dtags .tag.on { opacity: 1; box-shadow: 0 0 0 1px currentColor inset; }
  .dtags input { flex: 1; min-width: 80px; font-size: 13px; background: var(--surface-3); color: var(--ink); border: 1px solid var(--grid); border-radius: 999px; padding: 4px 10px; outline: none; }
  @media (max-width: 900px) { .tagbar { padding: 0 12px 8px; } }
  .star { flex: none; font-size: 17px; color: var(--muted); background: none; border: none; cursor: pointer; padding: 6px; border-radius: 4px; }
  .star.on { color: var(--accent-hi); }
  .empty { color: var(--muted); font-size: 13.5px; padding: 60px 8px; text-align: center; }
  .empty .big { font-size: 40px; margin-bottom: 10px; }
  .done-head { display: flex; align-items: center; gap: 8px; margin: 14px 0 6px; font-size: 13px; color: var(--ink-2); cursor: pointer; user-select: none; padding: 6px 4px; border-radius: 4px; width: fit-content; }
  .done-head .chev { display: inline-block; transition: transform .15s; font-size: 11px; }
  .done-head.closed .chev { transform: rotate(-90deg); }

  /* 追加バー（メイン下部に固定。MS To Do の "＋ タスクの追加"） */
  /* 追加バーは浮かせず、一覧の下に固定の帯として置く（タスクが裏に透けない） */
  .add { flex: none; margin: 8px 28px 18px; display: flex; align-items: center; gap: 12px; background: var(--surface-2); border: 1px solid var(--grid); border-radius: 4px; padding: 0 14px; min-height: 52px; }
  .add:focus-within { border-color: rgba(168,120,255,0.5); }
  .add .plus { color: var(--accent-hi); font-size: 20px; width: 18px; text-align: center; }
  .add input { flex: 1; min-width: 0; font-size: 14px; background: transparent; color: var(--ink); border: none; outline: none; padding: 10px 0; }
  .add input::placeholder { color: var(--ink-2); }
  .add .tools { display: flex; align-items: center; gap: 2px; flex: none; }
  .add .tool { position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: 4px; height: 36px; padding: 0 8px; border-radius: 4px; border: none; background: transparent; color: var(--ink-2); font-size: 16px; cursor: pointer; }
  .add .tool.on { color: var(--accent-hi); font-size: 12.5px; }
  .add .tool input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; min-width: 0; max-width: 100%; -webkit-appearance: none; appearance: none; font-size: 16px; cursor: pointer; } /* ネイティブの日付ピッカーをボタンの下に敷く（iOSでは本来の幅を持つので overflow:hidden で枠内に閉じ込める） */
  .add .tool .x { margin-left: 2px; font-size: 14px; opacity: .7; }
  .toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); z-index: 200; background: var(--surface-3); color: #fff; border: 1px solid rgba(168,120,255,0.5); border-radius: 8px; padding: 10px 14px; font-size: 13.5px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-width: 90vw; }
  .add .go { position: relative; z-index: 1; flex: none; font-size: 13px; font-weight: 600; color: #fff; background: var(--accent-deep); border: none; border-radius: 4px; padding: 7px 14px; min-height: 36px; cursor: pointer; }
  .add .go:disabled { opacity: .35; cursor: default; }

  /* 詳細ペイン（PCでは非表示時に消す。スマホはスライドで出入りするため display は使わない） */
  .detail { background: var(--surface); border-left: 1px solid var(--grid); display: flex; flex-direction: column; min-width: 0; }
  @media (min-width: 901px) { .detail:not(.show) { display: none; } }
  .detail .scroll { flex: 1; min-height: 0; overflow: auto; padding: 14px 16px; }
  .dcard { background: var(--surface-2); border-radius: 4px; margin-bottom: 8px; }
  .dhead { display: flex; align-items: center; gap: 12px; padding: 10px 14px; }
  .dhead .title-in { flex: 1; min-width: 0; font-size: 16px; font-weight: 600; background: transparent; border: none; color: #fff; outline: none; padding: 6px 0; }
  .dhead .title-in:focus { border-bottom: 1px solid var(--accent); }
  .steps { list-style: none; padding: 0 14px; }
  .steps li { display: flex; align-items: center; gap: 12px; min-height: 40px; border-bottom: 1px solid var(--grid); }
  .steps li:last-child { border-bottom: none; }
  .steps li span.t { flex: 1; font-size: 13.5px; }
  .steps li.done span.t { text-decoration: line-through; color: var(--muted); }
  .steps .chk { width: 16px; height: 16px; font-size: 9px; }
  .steps .rm { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 16px; padding: 4px; }
  .stepadd { display: flex; align-items: center; gap: 12px; padding: 0 14px; min-height: 42px; }
  .stepadd .plus { color: var(--accent-hi); font-size: 18px; width: 16px; text-align: center; }
  .stepadd input { flex: 1; min-width: 0; font-size: 13.5px; background: transparent; border: none; color: var(--ink); outline: none; }
  .stepadd input::placeholder { color: var(--accent-hi); }
  .drow { display: flex; align-items: center; gap: 12px; padding: 0 14px; min-height: 46px; border-bottom: 1px solid var(--grid); font-size: 13.5px; color: var(--ink-2); cursor: pointer; }
  .drow:last-child { border-bottom: none; }
  .drow .ico { width: 18px; text-align: center; color: var(--ink-2); flex: none; }
  .drow .lbl { flex: 1; min-width: 0; }
  .drow.on .lbl, .drow.on .ico { color: var(--accent-hi); }
  .drow .clear { background: none; border: none; color: var(--muted); font-size: 16px; cursor: pointer; padding: 4px; }
  .drow input[type=date], .drow input[type=datetime-local] { flex: 1; font-size: 13.5px; background: transparent; color: var(--ink); border: none; outline: none; color-scheme: dark; }
  .drow select { flex: 1; font-size: 13.5px; background: transparent; color: var(--ink); border: none; outline: none; }
  .drow select option { background: var(--surface-2); }
  .dnote { padding: 10px 14px; }
  .dnote textarea { width: 100%; min-height: 96px; resize: vertical; font-size: 13.5px; background: transparent; color: var(--ink); border: none; outline: none; }
  .dnote textarea::placeholder { color: var(--ink-2); }
  .dfoot { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; padding-bottom: max(8px, env(safe-area-inset-bottom)); border-top: 1px solid var(--grid); font-size: 12px; color: var(--muted); }
  .dfoot .ibtn { font-size: 16px; }

  /* ---- AI補助（詳細ペイン内） ---- */
  .ai { margin-bottom: 8px; border: 1px solid rgba(168,120,255,0.3); border-radius: 4px; padding: 12px 14px; background: linear-gradient(180deg, rgba(124,58,237,0.12), rgba(124,58,237,0.03)); }
  .ai h4 { font-size: 13px; color: var(--accent-hi); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .ai .kind { font-size: 11.5px; color: var(--muted); font-weight: 400; margin-left: auto; }
  .ai .dismiss { background: none; border: none; color: var(--muted); font-size: 18px; line-height: 1; cursor: pointer; padding: 0 2px; margin-left: 6px; }
  .ai h4 .kind + .dismiss { margin-left: 8px; }
  .ai h4:has(.dismiss):not(:has(.kind)) .dismiss { margin-left: auto; }
  .ai .q { margin: 8px 0; }
  .ai .q label { display: block; font-size: 13px; color: var(--ink-2); margin-bottom: 4px; }
  .ai .q input { width: 100%; font-size: 14px; background: var(--surface-2); color: var(--ink); border: 1px solid var(--border); border-radius: 4px; padding: 8px 10px; }
  .ai .q input:focus { outline: none; border-color: var(--accent); }
  .ai .draft { white-space: pre-wrap; font-size: 13.5px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px; padding: 10px; margin-top: 8px; overflow-wrap: anywhere; }
  .ai .draft b { color: var(--accent-hi); }
  .ai .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .ai .links { list-style: none; margin-top: 8px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
  .ai .links a { color: var(--accent-hi); overflow-wrap: anywhere; }
  .ai .links .ln { color: var(--muted); margin-left: 6px; font-size: 12px; }
  .ai .stepsug { margin-top: 8px; font-size: 13px; color: var(--ink-2); }
  .ai .stepsug ol { padding-left: 20px; margin-top: 4px; }
  .ai .status { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .ai .status:empty { display: none; }
  .ai .status.err { color: var(--bad); }
  /* 引っ張って同期（スマホ）: スクロール領域の上に出るインジケータ */
  .ptr { height: 0; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; font-size: 12px; color: var(--muted); transition: height .2s; }
  .ptr.armed { color: var(--accent-hi); }
  .ptr.busy { height: 36px !important; }

  /* hover はマウス環境のみ（タッチ端末では触れた状態が残って「選択したように」見えるため） */

    .nav li { padding: 12px 12px; font-size: 15px; }

    /* ○のタップ判定を広げる: 見た目は22pxのまま、透明な当たり判定を上下左右14px分足す（約50px四方） */

<body>

  <div class="app" id="app">
    <!-- サイドバー -->

        <div class="newlist"><input id="newlist" placeholder="リスト名" enterkeyhint="done"><button class="linkbtn" id="newlist-add" type="button">作成</button></div>
      </div>

    <!-- タスク一覧 -->
    <section class="main" id="main">
      <div class="listhead">

          <div class="popover" id="list-pop" hidden>
            <button id="list-rename" type="button">名前の変更</button>

          <button class="tool" id="add-remind" type="button" title="通知（アプリを開いているときに知らせます）"><span id="add-remind-lbl">⏰</span><input type="datetime-local" id="add-remind-in" tabindex="-1"></button>

</div>

<script>
/* ================================================================
   データ層（localStorage が主・GitHub は同期先）
   tasks: [{id,title,done,important,myDay,due,remind,remindFired,listId,steps:[{id,title,done}],note,ai,ct,mt}]
   remind: "YYYY-MM-DDTHH:MM"（ローカル時刻）。アプリを開いている間だけ監視し、時刻が来たら通知する
   tags: ["Teams","文章"] など。チャネル（TAG_CH）／種別（TAG_TY）の定型＋自由タグ
   lists: [{id,name,ct,mt}]   deleted: [id...]（墓標。端末間で削除を伝播）
   ================================================================ */
const KEY = "shiden_tasks_v1", DEL_KEY = "shiden_tasks_deleted_v1", CFG_KEY = "shiden_tasks_cfg";

/* ---- バージョンと更新履歴（公開版が反映されているかの確認用。変更のたびに先頭へ追記する） ---- */
const CHANGELOG = [
  ["2026-09-30.36", "「文章作成」を「新規文章作成」に改名（自動移行）。ツール・種別に「その他ツール」「その他種別」を追加"],
  ["2026-09-30.35", "種別タグに「返信」を追加。順を 対応→返信→文章作成→成果物作成→手配→検討 に"],
  ["2026-09-30.34", "種別タグの順を 対応→手配→文章作成→成果物作成→検討 に変更"],
  ["2026-09-30.33", "タグの表示順を常に ツール→種別→自由 に固定"],
  ["2026-09-30.32", "フィルタバーに定型タグを常時表示（0件は薄く）"],
  ["2026-09-30.31", "ツールタグに Excel / Word / PP を追加"],
  ["2026-09-30.30", "種別タグを「文章作成」「成果物作成」に改名（既存データは自動移行）"],
  ["2026-09-30.29", "PC: 詳細ペインを常に表示（× で閉じても領域は残る）"],
  ["2026-09-30.28", "種別タグ「実施」を「対応」に改名（既存データは自動移行）"],
  ["2026-09-30.27", "種別タグに「実施」を追加"],
  ["2026-09-30.26", "タグ付け: 案件（Teams/Outlook/LINE）と種別（文章/作成/検討/手配）＋自由タグ。一覧でタグ絞り込み。AIが判定時にタグを自動提案"],
  ["2026-09-30.25", "AI補助を拡張: 「手配・調べもの」種類を追加しWeb検索で候補を提示（リンク付き）。段取り案を「ステップに追加」できる。作業タスクも手順をステップ化"],
  ["2026-09-30.24", "AI補助に × を追加（質問・下書きを消して初期状態へ。問い合わせ中は中断）"],
  ["2026-09-30.23", "スマホ: 「追加」ボタンが ⏰ の入力欄に隠れて押せない不具合を修正"],
  ["2026-09-30.22", "リスト作成時にそのリストへ移動しない"],
  ["2026-09-30.21", "設定の owner / repo / path / branch を既定値入りに（トークンだけ入力すれば同期）"],
  ["2026-09-30.20", "設定に「通知の許可と動作確認」ボタンと状態表示を追加"],
  ["2026-09-30.19", "追加バーを一覧の下の固定帯に（タスクが裏に透けない）"],
  ["2026-09-30.18", "追加バーに 📅 期限・⏰ 通知ボタンを追加。詳細にも通知欄。時刻になるとOS通知またはトースト（アプリを開いている間のみ）"],
  ["2026-09-30.17", "PC: タスクが増えると一覧をスクロールできない不具合を修正"],
  ["2026-09-30.16", "スマホ: タスクに触れたときの選択風ハイライトを廃止"],
  ["2026-09-30.15", "スマホ: 完了○のタップ判定を拡大（約50px四方）"],
  ["2026-09-30.14", "スマホも: タスク追加時に詳細を開かない"],
  ["2026-09-30.13", "PC: タスク追加時に詳細を開かず、続けて入力できるように"],
  ["2026-09-30.12", "スマホ: 一覧の上端で下に引っ張って離すと同期"],
  ["2026-09-30.11", "スマホ: 左端から右へスワイプで前の画面に戻れるように"],
  ["2026-09-30.10", "同期エラーに原因のヒントを表示（PUT 404 など）"],
  ["2026-09-30.9", "設定を独立した全画面ページに変更"],
  ["2026-09-30.8", "iPhone でアプリバーがステータスバーに重なる不具合を修正"],
  ["2026-09-30.7", "設定に更新履歴とバージョン表示を追加"],
  ["2026-09-30.6", "スマホの画面遷移をスライドアニメーションに"],
  ["2026-09-30.5", "UIを Microsoft To Do 準拠に再構成（3ペイン・完了折りたたみ・詳細ペイン下部バー）"],
  ["2026-09-30.4", "AI補助を OpenAI API（gpt-5-mini）に切替"],
  ["2026-09-30.3", "スマホ画面対応（チップ列・下部固定の追加欄）"],
  ["2026-09-30.2", "スマートリストで「リスト削除」が出るバグ修正"],
  ["2026-09-30.1", "Shiden-Tasks 公開（Phase 1）"],
];
const VERSION = CHANGELOG[0][0];
document.getElementById("ver").textContent = "v" + VERSION;
document.getElementById("changelog").innerHTML = CHANGELOG.map(([v, m], i) => `<li class="${i === 0 ? "cur" : ""}"><span class="v">${v}</span><span>${m}</span></li>`).join("");
const SMART = { myday: "今日の予定", important: "重要", planned: "今後の予定", all: "タスク" };
const SMART_ICO = { myday: "☀️", important: "⭐", planned: "📅", all: "🏠" };
const TAG_CH = ["Teams", "Outlook", "LINE", "Excel", "Word", "PP", "その他ツール"];  // どこの案件か／何で作るか（PP＝PowerPoint）
const TAG_TY = ["対応", "返信", "新規文章作成", "成果物作成", "手配", "検討", "その他種別"];  // 表示順  // どんな仕事か（対応＝アンケート回答・申請など、考えずにサッと片付ける軽い作業）
const TAG_RENAME = { "実施": "対応", "文章": "新規文章作成", "文章作成": "新規文章作成", "作成": "成果物作成" }; // 旧名称の移行（読み込み時に置換）
function tagClass(tag) { return TAG_CH.includes(tag) ? "ch" : TAG_TY.includes(tag) ? "ty" : "fr"; }
function tagChip(tag, on) { return `<span class="tag ${tagClass(tag)} ${on ? "on" : ""}" data-tag="${esc(tag)}">${esc(tag)}</span>`; }
let tagFilter = null; // 一覧のタグ絞り込み（null=すべて）
// 表示順は常に ツール（青）→ 種別（緑）→ 自由タグ。付けた順序に依存させない
function sortTags(tags) {
  const rank = g => TAG_CH.includes(g) ? TAG_CH.indexOf(g) : TAG_TY.includes(g) ? 100 + TAG_TY.indexOf(g) : 200;
  return [...(tags || [])].sort((a, b) => rank(a) - rank(b) || a.localeCompare(b, "ja"));
}

function load() { try { return Object.assign({ tasks: [], lists: [] }, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) { return { tasks: [], lists: [] }; } }
function save(d) { localStorage.setItem(KEY, JSON.stringify(d)); }
function deleted() { try { return JSON.parse(localStorage.getItem(DEL_KEY)) || []; } catch (e) { return []; } }
function saveDeleted(a) { localStorage.setItem(DEL_KEY, JSON.stringify(a)); }
function newId() { return (self.crypto && crypto.randomUUID) ? crypto.randomUUID() : "t" + Date.now() + Math.random().toString(36).slice(2); }
function now() { return Date.now(); }
function todayStr() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function fmtDue(d) {
  // 期限の表示: 今日／明日／M月D日(曜)。MS To Do と同じ感覚で相対表記にする
  const td = todayStr(); if (d === td) return "今日";
  const t = new Date(); t.setDate(t.getDate() + 1);
  const tm = t.getFullYear() + "-" + String(t.getMonth() + 1).padStart(2, "0") + "-" + String(t.getDate()).padStart(2, "0");
  if (d === tm) return "明日";
  const [y, m, dd] = d.split("-").map(Number); const dt = new Date(y, m - 1, dd);
  return dt.toLocaleDateString("ja-JP", { month: "numeric", day: "numeric", weekday: "short" });
}
function fmtRemind(r) {
  // "YYYY-MM-DDTHH:MM" → "10/6 9:00"（今日なら "今日 9:00"）
  const [d, hm] = r.split("T"); if (!d || !hm) return r;
  const [h, m] = hm.split(":"); const time = Number(h) + ":" + m;
  if (d === todayStr()) return "今日 " + time;
  const [y, mo, dd] = d.split("-").map(Number);
  return mo + "/" + dd + " " + time;
}
const isMobile = () => window.innerWidth <= 900;

let db = load();
// 旧タグ名の移行（実施→対応）。同期で戻ってきたデータにも適用するため render 前に毎回通す
function migrateTags() { let ch = false; db.tasks.forEach(t => { if (!t.tags) return; const n = t.tags.map(g => TAG_RENAME[g] || g); if (n.join() !== t.tags.join()) { t.tags = [...new Set(n)]; t.mt = now(); ch = true; } }); if (ch) { save(db); scheduleSync(); } }
migrateTags();
let view = "myday";           // 表示中のリスト（スマート or リストid）
let selectedId = null;        // 詳細表示中のタスク
let doneOpen = true;          // 「完了」セクションの開閉

function touch(t) { t.mt = now(); save(db); scheduleSync(); }
function task(id) { return db.tasks.find(t => t.id === id); }

function addTask(title, listId, opt) {
  opt = opt || {};
  const t = { id: newId(), title, done: false, important: view === "important", myDay: view === "myday", due: opt.due || (view === "planned" ? todayStr() : ""), remind: opt.remind || "", remindFired: false, tags: [], listId: listId || (SMART[view] ? "" : view), steps: [], note: "", ai: null, ct: now(), mt: now() };
  db.tasks.push(t); save(db); scheduleSync();
  return t;
}
function removeTask(id) {
  db.tasks = db.tasks.filter(t => t.id !== id);
  const d = deleted(); d.push(id); saveDeleted(d); save(db);
  if (selectedId === id) selectedId = null;
  scheduleSync(); render();
}
function addList(name) { const l = { id: newId(), name, ct: now(), mt: now() }; db.lists.push(l); save(db); scheduleSync(); return l; }
function removeList(id) {
  db.lists = db.lists.filter(l => l.id !== id);
  db.tasks.forEach(t => { if (t.listId === id) { t.listId = ""; t.mt = now(); } });
  const d = deleted(); d.push(id); saveDeleted(d); save(db); view = "all"; scheduleSync(); render();
}

/* ---- 表示対象の抽出 ---- */
function visibleTasks() {
  const td = todayStr();
  return db.tasks.filter(t => {
    if (view === "myday") return t.myDay || (t.due === td && !t.done);
    if (view === "important") return t.important;
    if (view === "planned") return !!t.due;
    if (view === "all") return true;
    return t.listId === view;
  });
}

/* ================================================================
   描画
   ================================================================ */
function render() { migrateTags(); renderNav(); renderList(); renderDetail(); document.body.classList.toggle("m-list", mobileScreen === "list"); }
let mobileScreen = "home"; // スマホ: "home"=リスト一覧 / "list"=タスク一覧

function renderNav() {
  const cnt = k => { const v = view; view = k; const n = visibleTasks().filter(t => !t.done).length; view = v; return n; };
  const item = (k, ico, name) => `<li class="${view === k ? "active" : ""}" data-view="${k}"><span class="ico">${ico}</span><span class="nm">${esc(name)}</span><span class="cnt">${cnt(k) || ""}</span></li>`;
  let html = Object.keys(SMART).map(k => item(k, SMART_ICO[k], SMART[k])).join("");
  html += `<div class="sep"></div>`;
  html += db.lists.map(l => item(l.id, "☰", l.name)).join("");
  document.getElementById("nav").innerHTML = html;
}

function renderList() {
  const list = db.lists.find(l => l.id === view);
  document.getElementById("list-title").innerHTML = `<span>${list ? "☰" : SMART_ICO[view]}</span>${esc(SMART[view] || (list ? list.name : ""))}`;
  document.getElementById("list-date").textContent = view === "myday" ? new Date().toLocaleDateString("ja-JP", { month: "long", day: "numeric", weekday: "long" }) : "";
  document.getElementById("list-menu").hidden = !list;
  document.getElementById("list-pop").hidden = true;
  document.getElementById("main").classList.toggle("myday", view === "myday");
  const all = visibleTasks();
  // タグバー: 表示中のリストに存在するタグだけを出す
  const counts = {}; all.forEach(t => (t.tags || []).forEach(g => counts[g] = (counts[g] || 0) + 1));
  // 定型タグは常に並べる（0件は薄く）。自由タグはその一覧に存在するものだけ
  const tagsHere = [...TAG_CH, ...TAG_TY, ...Object.keys(counts).filter(g => !TAG_CH.includes(g) && !TAG_TY.includes(g)).sort()];
  const chipOf = g => tagChip(g, tagFilter === g).replace('class="tag', `class="tag ${counts[g] ? "" : "zero"}`);
  const free = tagsHere.filter(g => !TAG_CH.includes(g) && !TAG_TY.includes(g));
  document.getElementById("tagbar").innerHTML = TAG_CH.map(chipOf).join("") + `<span class="sep"></span>` + TAG_TY.map(chipOf).join("") + (free.length ? `<span class="sep"></span>` + free.map(chipOf).join("") : "") + (tagFilter ? `<button class="clear" data-tag="">× 絞り込み解除</button>` : "");
  const ts = tagFilter ? all.filter(t => (t.tags || []).includes(tagFilter)) : all;
  const open = ts.filter(t => !t.done).sort((a, b) => (b.important - a.important) || (a.due || "9").localeCompare(b.due || "9") || b.ct - a.ct);
  const done = ts.filter(t => t.done).sort((a, b) => b.mt - a.mt);
  const td = todayStr();
  const row = t => {
    const meta = [];
    const ln = t.listId ? (db.lists.find(l => l.id === t.listId) || {}).name : "タスク";
    if (SMART[view] && ln) meta.push(`<span>${esc(ln)}</span>`);
    if (t.myDay && view !== "myday") meta.push(`<span>☀️ 今日の予定</span>`);
    if (t.due) meta.push(`<span class="${!t.done && t.due < td ? "over" : (t.due === td ? "today" : "")}">📅 ${fmtDue(t.due)}</span>`);
    if (t.remind && !t.done) meta.push(`<span class="${t.remindFired ? "" : "today"}">⏰ ${fmtRemind(t.remind)}</span>`);
    if (t.steps.length) meta.push(`<span>${t.steps.filter(s => s.done).length}/${t.steps.length}</span>`);
    if (t.note) meta.push(`<span>📝</span>`);
    sortTags(t.tags).forEach(g => meta.push(tagChip(g)));
    if (t.ai && t.ai.draft) meta.push(`<span class="aim">⚡ 下書きあり</span>`);
    else if (t.ai && t.ai.questions && !t.ai.draft) meta.push(`<span class="aim">⚡ 回答待ち</span>`);
    return `<li class="task ${t.done ? "done" : ""} ${selectedId === t.id ? "sel" : ""}" data-id="${t.id}">
      <span class="chk" data-act="toggle" title="${t.done ? "未完了に戻す" : "完了にする"}">${t.done ? "✓" : ""}</span>
      <div class="body"><div class="title">${esc(t.title)}</div>${meta.length ? `<div class="meta">${meta.join("")}</div>` : ""}</div>
      <button class="star ${t.important ? "on" : ""}" data-act="star" title="${t.important ? "重要から外す" : "重要としてマーク"}">${t.important ? "★" : "☆"}</button>
    </li>`;
  };
  let html = open.map(row).join("");
  if (!open.length && !done.length) html += `<div class="empty"><div class="big">${list ? "☰" : SMART_ICO[view]}</div>${view === "myday" ? "今日に集中しましょう。下の欄からタスクを追加できます。" : "タスクはありません"}</div>`;
  if (done.length) html += `<div class="done-head ${doneOpen ? "" : "closed"}" id="done-head"><span class="chev">▾</span>完了 ${done.length}</div>` + (doneOpen ? done.map(row).join("") : "");
  document.getElementById("tasks").innerHTML = html;
}

/* ================================================================
   AI補助（OpenAI API を端末から直接呼ぶ）
   1) 意図判定＋不足情報の問い返し（質問リスト）
   2) 回答を受けて下書き生成（メール／Teams／会議依頼／作業手順）
   ================================================================ */
const AI_KINDS = { email: "メール", teams: "Teams/チャット", meeting: "会議・日程調整", line: "LINE", research: "手配・調べもの（Web検索）", work: "作業タスク", other: "その他" };
const SEARCH_KINDS = new Set(["research"]); // 下書き時に Web 検索を使う種類

function renderAi(t) {
  const a = t.ai || {};
  const cfg = getCfg();
  let body = "";
  if (!cfg.openai) {
    body = `<div class="status">「⚙️ 設定」で OpenAI API キーを入れると、AIがこのタスクの内容を確認して下書きを作ります。</div>`;
  } else if (!a.questions) {
    body = `<div class="actions"><button class="btn" data-ai="ask">⚡ AIに相談する</button></div><div class="status" id="ai-status"></div>`;
  } else {
    body = a.questions.map((q, i) => `<div class="q"><label>${i + 1}. ${esc(q)}</label><input data-ans="${i}" value="${esc((a.answers || [])[i] || "")}" placeholder="回答（空欄でも可）"></div>`).join("");
    body += `<div class="actions"><button class="btn" data-ai="draft">${a.draft ? "↻ 下書きを作り直す" : "✍️ 下書きを作る"}</button><button class="linkbtn" data-ai="reask">質問をやり直す</button></div>`;
    if (a.draft) {
      const d = a.draft;
      body += `<div class="draft" id="ai-draft">${d.subject ? `<b>件名:</b> ${esc(d.subject)}\n\n` : ""}${esc(d.body || "")}${d.notes ? `\n\n<b>補足:</b> ${esc(d.notes)}` : ""}</div>`;
      if (d.links && d.links.length) body += `<ul class="links">${d.links.map(l => `<li><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.title || l.url)}</a>${l.note ? `<span class="ln">${esc(l.note)}</span>` : ""}</li>`).join("")}</ul>`;
      if (d.steps && d.steps.length) body += `<div class="stepsug"><b>段取り案:</b><ol>${d.steps.map(x => `<li>${esc(x)}</li>`).join("")}</ol></div>`;
      body += `<div class="actions"><button class="linkbtn" data-ai="copy">📋 本文をコピー</button>${d.subject ? `<button class="linkbtn" data-ai="copysub">件名をコピー</button>` : ""}${a.kind === "email" ? `<button class="linkbtn" data-ai="mailto">✉️ メールを開く</button>` : ""}${d.steps && d.steps.length ? `<button class="linkbtn" data-ai="addsteps">☑ ステップに追加</button>` : ""}</div>`;
    }
    body += `<div class="status" id="ai-status"></div>`;
  }
  const canDismiss = !!(a.questions || aiBusy === t.id);
  return `<div class="ai"><h4>⚡ AI補助${a.kind ? `<span class="kind">${AI_KINDS[a.kind] || a.kind}</span>` : ""}${canDismiss ? `<button class="dismiss" data-ai="dismiss" title="AI補助をやめる（質問と下書きを消します）">×</button>` : ""}</h4>${body}</div>`;
}

function extractJson(text) {
  // モデルが前後に文を付けても、最初の { から最後の } までを JSON として取り出す
  const s = text.indexOf("{"), e = text.lastIndexOf("}");
  if (s < 0 || e < 0) throw new Error("JSONが見つかりません");
  return JSON.parse(text.slice(s, e + 1));
}

let aiAbort = null, aiBusy = null; // 進行中の問い合わせ（× で中断できるように保持）
async function callAISearch(system, user, maxTokens) {
  // Responses API ＋ web_search ツールで実際に検索させる。失敗したら通常の呼び出しにフォールバック
  const cfg = getCfg();
  if (!cfg.openai) throw new Error("APIキー未設定");
  if (aiAbort) aiAbort.abort();
  aiAbort = new AbortController();
  const r = await fetch("https://api.openai.com/v1/responses", {
    method: "POST", signal: aiAbort.signal,
    headers: { "Content-Type": "application/json", Authorization: "Bearer " + cfg.openai },
    body: JSON.stringify({
      model: cfg.model || "gpt-5-mini",
      tools: [{ type: "web_search" }],
      max_output_tokens: maxTokens || 4096,
      instructions: system,
      input: user,
    }),
  });
  if (!r.ok) { let m = "HTTP " + r.status; try { const j = await r.json(); m += " " + (j.error && j.error.message || ""); } catch (e) {} throw new Error(m); }
  const j = await r.json();
  if (j.status === "incomplete") throw new Error("応答が途中で切れました");
  const texts = [];
  (j.output || []).forEach(o => { if (o.type === "message") (o.content || []).forEach(c => { if (c.type === "output_text") texts.push(c.text); }); });
  return texts.join("");
}
async function callAI(system, user, maxTokens) {
  // OpenAI Chat Completions をブラウザから直接呼ぶ。応答はJSONのみ（response_format）
  const cfg = getCfg();
  if (!cfg.openai) throw new Error("APIキー未設定");
  if (aiAbort) aiAbort.abort();
  aiAbort = new AbortController();
  const r = await fetch("https://api.openai.com/v1/chat/completions", {
    method: "POST", signal: aiAbort.signal,
    headers: { "Content-Type": "application/json", Authorization: "Bearer " + cfg.openai },
    body: JSON.stringify({
      model: cfg.model || "gpt-5-mini",
      max_completion_tokens: maxTokens || 2048,
      response_format: { type: "json_object" },
      messages: [{ role: "system", content: system }, { role: "user", content: user }],
    }),
  });
  if (!r.ok) { let m = "HTTP " + r.status; try { const j = await r.json(); m += " " + (j.error && j.error.message || ""); } catch (e) {} throw new Error(m); }
  const j = await r.json();
  const c = j.choices && j.choices[0];
  if (!c) throw new Error("応答が空です");
  if (c.finish_reason === "content_filter") throw new Error("AIが回答を控えました（コンテンツフィルタ）");
  if (c.finish_reason === "length") throw new Error("応答が長すぎて途中で切れました");
  return (c.message && c.message.content) || "";
}

const SYS_ASK = `あなたは日本語のタスク管理アシスタントです。ユーザーの仕事環境は Outlook メール・Microsoft Teams・LINE です。
与えられたタスクの種類を判定し、良い成果物（メール本文・Teamsメッセージ・会議依頼・作業手順など）を作るために不足している情報を、ユーザーに聞く質問として2〜4個挙げてください。
- 質問は具体的で短く、選択肢がある場合は「（依頼／報告／お礼／催促）」のように括弧で例示する
- 宛先・目的・期限・伝えたい要点・温度感（丁寧さ）など、本当に必要なものだけ
- 出力は次のJSONのみ。前後に説明文を付けない
種類の判定基準:
- email / teams / line: 誰かに文章を送る
- meeting: 会議や打ち合わせの日程調整
- research: 予約・手配・購入・調べもの（例: ゴルフのセッティング、店の予約、旅行、備品の購入、比較検討）。この場合は同行者・希望日時・場所や地域・予算・条件を聞く
- work: 自分で行う作業（資料作成、週報、確認作業など）。この場合は成果物・期限・材料を聞く
さらに tags として、案件のツール（Teams / Outlook / LINE / Excel / Word / PP のいずれか。PP は PowerPoint。どれにも当てはまらない道具なら「その他ツール」。分からなければ入れない）と仕事の種別（対応=アンケート回答・申請・提出など考えずにすぐ片付く軽い作業 / 返信=届いたメールやメッセージへの返事 / 新規文章作成=新規にメールやメッセージなど文を書く / 成果物作成=資料・図・データなど物を作る / 手配=予約や調達 / 検討=考える・比較する / その他種別=どれにも当てはまらない、のいずれか1つ）を付ける。
{"kind":"email|teams|meeting|line|research|work|other","tags":["Teams","新規文章作成"],"questions":["…","…"]}`;

const SYS_DRAFT = `あなたは日本語のビジネス文書アシスタントです。ユーザーの仕事環境は Outlook メール・Microsoft Teams・LINE です。
タスク・種類・質問と回答をもとに、そのまま使える下書きを作ってください。
- メールなら件名と本文（宛名・挨拶・本題・結び）。Teams/LINE なら簡潔なメッセージ。会議なら日程調整の依頼文。作業なら手順リスト
- 回答が空欄の項目は、一般的な前提で自然に補う（過度な推測はしない）
- 作業タスク（work）は body に要点を書き、steps に実行順の手順（3〜8個・短文）を入れる
- 出力は次のJSONのみ。前後に説明文を付けない
{"subject":"件名（メール以外は空文字）","body":"本文","notes":"送る前に確認すべき点があれば一言（無ければ空文字）","steps":["手順（workのみ。他は空配列）"]}`;

const SYS_RESEARCH = `あなたは日本語の手配・調査アシスタントです。Web検索を使って、タスクと回答に合う候補を実際に調べてください。
- 候補は3〜5件。名称・所在地や地域・料金や条件の目安・選んだ理由を簡潔に
- 検索で確認できなかったことは推測で書かず「要確認」とする
- body には候補の比較を箇条書きで。links には候補の公式サイトや予約ページのURLを入れる
- steps には予約・連絡・準備の段取りを実行順に3〜8個（短文）
- 出力は次のJSONのみ。前後に説明文を付けない
{"subject":"","body":"候補の比較（箇条書き）","notes":"決める前に確認すべき点（無ければ空文字）","links":[{"title":"候補名","url":"https://…","note":"一言"}],"steps":["段取り"]}`;

async function aiAsk(t) {
  aiBusy = t.id; renderDetail(); setAiStatus("<span class='spin'></span>AIがタスクを確認しています…");
  try {
    const out = await callAI(SYS_ASK, `タスク: ${t.title}${t.note ? "\nメモ: " + t.note : ""}${t.due ? "\n期限: " + t.due : ""}`, 1024);
    const j = extractJson(out);
    t.ai = { kind: j.kind || "other", questions: Array.isArray(j.questions) ? j.questions.slice(0, 5) : [], answers: [], draft: null };
    // タグが未設定なら AI の提案を採用（定型タグのみ。ユーザーが付けたものは上書きしない）
    if (!(t.tags || []).length && Array.isArray(j.tags)) t.tags = j.tags.filter(g => TAG_CH.includes(g) || TAG_TY.includes(g)).slice(0, 2);
    aiBusy = null; touch(t); render();
  } catch (e) { aiBusy = null; if (e.name === "AbortError") { renderDetail(); return; } setAiStatus("失敗: " + e.message, true); }
}
async function aiDraft(t) {
  const a = t.ai;
  a.answers = [...document.querySelectorAll("[data-ans]")].map(i => i.value.trim());
  touch(t);
  setAiStatus("<span class='spin'></span>下書きを作成中…");
  try {
    const qa = a.questions.map((q, i) => `Q${i + 1}: ${q}\nA${i + 1}: ${a.answers[i] || "（未回答）"}`).join("\n");
    const user = `タスク: ${t.title}\n種類: ${AI_KINDS[a.kind] || a.kind}${t.note ? "\nメモ: " + t.note : ""}${t.due ? "\n期限: " + t.due : ""}\n\n${qa}`;
    let out, searched = false;
    if (SEARCH_KINDS.has(a.kind)) {
      setAiStatus("<span class='spin'></span>Webで候補を検索しています…");
      try { out = await callAISearch(SYS_RESEARCH, user, 6000); searched = true; }
      catch (e) { if (e.name === "AbortError") throw e; out = await callAI(SYS_DRAFT, user, 4096); } // 検索が使えない場合は通常生成
    } else out = await callAI(SYS_DRAFT, user, 4096);
    const j = extractJson(out);
    a.draft = { subject: j.subject || "", body: j.body || out, notes: (j.notes || "") + (SEARCH_KINDS.has(a.kind) && !searched ? "（Web検索が使えなかったため一般知識で作成。リンクや料金は要確認）" : ""),
      links: Array.isArray(j.links) ? j.links.filter(l => l && l.url).slice(0, 8) : [], steps: Array.isArray(j.steps) ? j.steps.filter(Boolean).slice(0, 10) : [] };
    touch(t); render();
  } catch (e) { if (e.name === "AbortError") return; setAiStatus("失敗: " + e.message, true); }
}
function setAiStatus(html, err) { const s = document.getElementById("ai-status"); if (s) { s.innerHTML = html; s.classList.toggle("err", !!err); } }
async function copyText(s, label) {
  try { await navigator.clipboard.writeText(s); setAiStatus(label + "をコピーしました"); }
  catch (e) { setAiStatus("コピーできませんでした。テキストを選択して手動でコピーしてください", true); }
}

/* ================================================================
   通知（⏰）: アプリを開いている間、30秒ごとに時刻を監視して知らせる
   ・OSの通知（Notification API）を許可していればOS通知、無ければ画面内トースト
   ・Web Push（サーバー要）は使わないため、アプリを閉じている間は鳴らない
   ================================================================ */
function notifState() {
  const el = document.getElementById("notif-state"); if (!el) return;
  if (!("Notification" in window)) { el.textContent = "この環境は OS 通知に対応していません（画面内トーストのみ）"; return; }
  el.textContent = { granted: "許可済み: OS 通知が使えます", denied: "ブロック中: ブラウザのサイト設定で通知を許可に戻してください", default: "未設定: 上のボタンで許可してください" }[Notification.permission];
}
document.getElementById("notif-test").addEventListener("click", async () => {
  if (!("Notification" in window)) return notifState();
  if (Notification.permission === "default") await Notification.requestPermission();
  notifState();
  if (Notification.permission === "granted") new Notification("Shiden Tasks", { body: "通知のテストです。この表示が出れば OS 通知が有効です", icon: "icon-192.png" });
  else toast("⏰ 画面内トーストのテスト（OS 通知は未許可）");
});
document.getElementById("gh-config").addEventListener("click", notifState);
function askNotifyPermission() { if ("Notification" in window && Notification.permission === "default") Notification.requestPermission(); }
function toast(msg) { const el = document.createElement("div"); el.className = "toast"; el.textContent = msg; document.body.appendChild(el); setTimeout(() => el.remove(), 6000); }
function checkReminders() {
  const nowLocal = new Date(); const cur = nowLocal.getFullYear() + "-" + String(nowLocal.getMonth() + 1).padStart(2, "0") + "-" + String(nowLocal.getDate()).padStart(2, "0") + "T" + String(nowLocal.getHours()).padStart(2, "0") + ":" + String(nowLocal.getMinutes()).padStart(2, "0");
  let changed = false;
  db.tasks.forEach(t => {
    if (!t.remind || t.remindFired || t.done || t.remind > cur) return;
    t.remindFired = true; t.mt = now(); changed = true;
    const body = "Shiden Tasks の通知";
    if ("Notification" in window && Notification.permission === "granted") { try { new Notification(t.title, { body, icon: "icon-192.png", tag: t.id }); } catch (e) { toast("⏰ " + t.title); } }
    else toast("⏰ " + t.title);
  });
  if (changed) { save(db); scheduleSync(); render(); }
}
setInterval(checkReminders, 30000);
checkReminders();

  el.querySelector("#d-step").addEventListener("keydown", e => { if (e.key !== "Enter") return; const v = e.target.value.trim(); if (!v) return; t.steps.push({ id: newId(), title: v, done: false }); touch(t); render(); setTimeout(() => document.getElementById("d-step").focus(), 0); });
  el.querySelector("#d-steps").addEventListener("click", e => {

  });
  el.querySelector(".dtags").addEventListener("click", e => {

    const g = c.dataset.tag; t.tags = t.tags || [];

  el.querySelector("#d-tag").addEventListener("keydown", e => {

  el.querySelectorAll("[data-ai]").forEach(b => b.addEventListener("click", () => {

    if (a === "dismiss") { if (aiAbort) aiAbort.abort(); aiBusy = null; t.ai = null; touch(t); render(); return; }
    if (a === "ask" || a === "reask") return aiAsk(t);

  }));
}

/* ================================================================
   GitHub 同期（Shiden LifeLogger と同じ方式：id単位マージ＋墓標＋409再試行）
   ================================================================ */
const statusEl = document.getElementById("gh-status"), panel = document.getElementById("cfg-panel");
function getCfg() { try { return JSON.parse(localStorage.getItem(CFG_KEY)) || {}; } catch (e) { return {}; } }
function setCfg(c) { localStorage.setItem(CFG_KEY, JSON.stringify(c)); }
function cfgOk(c) { return c && c.owner && c.repo && c.path && c.token; }
function status(m) { statusEl.textContent = m; }
function hhmm() { const d = new Date(); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
const b64enc = s => btoa(unescape(encodeURIComponent(s)));
const b64dec = s => decodeURIComponent(escape(atob((s || "").replace(/\n/g, ""))));

function ghErr(op, code) {
  // GitHub は権限のないリポジトリを 404 で返すため、原因が分かる文言を添える
  const hint = { 401: "トークンが無効か期限切れ", 403: "権限不足（Contents: Read and write が必要）", 404: op === "PUT" ? "トークンにこのリポジトリへの書き込み権限がありません（Repository access に Hayahide-Log を含め、Contents を Read and write に）" : "リポジトリ名かトークンの対象リポジトリを確認", 409: "競合（自動で再試行します）", 422: "リクエスト不正（ブランチ名を確認）" }[code];
  return op + " " + code + (hint ? "：" + hint : "");
}
async function ghGet(c) {
  // 古いshaが返るとPUTが409になるため、キャッシュ無効＋時刻パラメータで常に最新を取る（ヘッダー追加はCORSで弾かれるので使わない）
  const url = `https://api.github.com/repos/${c.owner}/${c.repo}/contents/${c.path}?ref=${c.branch || "main"}&t=${Date.now()}`;
  const r = await fetch(url, { cache: "no-store", headers: { Authorization: "Bearer " + c.token, Accept: "application/vnd.github+json" } });
  if (r.status === 404) return { data: null, sha: null };
  if (!r.ok) throw new Error(ghErr("GET", r.status));
  const j = await r.json();
  return { data: JSON.parse(b64dec(j.content)), sha: j.sha };
}
async function ghPut(c, obj, sha) {
  const url = `https://api.github.com/repos/${c.owner}/${c.repo}/contents/${c.path}`;
  const body = { message: "tasks " + new Date().toISOString(), content: b64enc(JSON.stringify(obj)), branch: c.branch || "main" };
  if (sha) body.sha = sha;
  const r = await fetch(url, { method: "PUT", headers: { Authorization: "Bearer " + c.token, Accept: "application/vnd.github+json", "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error(ghErr("PUT", r.status));
  return (await r.json()).content.sha;
}
function mergeById(a, b, del) {
  // 同じidは mt（更新時刻）が新しい方を採用。墓標にあるものは除外
  const m = new Map();
  [...(a || []), ...(b || [])].forEach(x => { if (!x.id || del.has(x.id)) return; const p = m.get(x.id); if (!p || (x.mt || 0) >= (p.mt || 0)) m.set(x.id, x); });
  return [...m.values()];
}
function merge(local, remote) {
  remote = remote || {};
  const del = new Set([...(local.deleted || []), ...(remote.deleted || [])]);
  return { tasks: mergeById(local.tasks, remote.tasks, del), lists: mergeById(local.lists, remote.lists, del), deleted: [...del] };
}
async function syncOnce(c) {
  const remote = await ghGet(c);
  const merged = merge({ tasks: db.tasks, lists: db.lists, deleted: deleted() }, remote.data);
  db = { tasks: merged.tasks, lists: merged.lists }; save(db); saveDeleted(merged.deleted);
  await ghPut(c, merged, remote.sha);
}
let syncing = false, syncTimer = null;
async function sync() {
  const c = getCfg();
  if (!cfgOk(c)) { status("未同期（ローカルのみ）"); return; }
  if (syncing) return;
  syncing = true; status("同期中…");
  try {
    let done = false, lastErr;
    for (let i = 0; i < 5 && !done; i++) { try { await syncOnce(c); done = true; } catch (e) { lastErr = e; if (!/\b409\b/.test(e.message)) throw e; } }
    if (!done) throw lastErr;
    render(); status("同期完了 " + hhmm());
  } catch (e) { status("同期失敗: " + e.message); } finally { syncing = false; }
}
function scheduleSync() { if (!cfgOk(getCfg())) return; clearTimeout(syncTimer); syncTimer = setTimeout(sync, 2500); }

function fillCfg() {
  const c = getCfg();
  // owner / repo は既定値入り（公開情報なので問題なし）。トークンだけ手入力すれば同期が始まる
  document.getElementById("cfg-owner").value = c.owner || "hayahide-cloud";
  document.getElementById("cfg-repo").value = c.repo || "Hayahide-Log";
  document.getElementById("cfg-path").value = c.path || "tasks.json";
  document.getElementById("cfg-branch").value = c.branch || "main";
  document.getElementById("cfg-token").value = c.token || "";
  document.getElementById("cfg-openai").value = c.openai || "";
  document.getElementById("cfg-model").value = c.model || "gpt-5-mini";
}
document.getElementById("gh-config").addEventListener("click", () => { fillCfg(); panel.classList.add("open"); });
document.getElementById("cfg-close").addEventListener("click", () => panel.classList.remove("open"));
document.getElementById("cfg-save").addEventListener("click", () => {
  setCfg({
    owner: document.getElementById("cfg-owner").value.trim() || "hayahide-cloud", repo: document.getElementById("cfg-repo").value.trim() || "Hayahide-Log",
    path: document.getElementById("cfg-path").value.trim() || "tasks.json", branch: document.getElementById("cfg-branch").value.trim() || "main",
    token: document.getElementById("cfg-token").value.trim(),
    openai: document.getElementById("cfg-openai").value.trim(), model: document.getElementById("cfg-model").value,
  });
  panel.classList.remove("open"); render(); sync();
});
document.getElementById("cfg-clear").addEventListener("click", () => { localStorage.removeItem(CFG_KEY); fillCfg(); render(); status("設定を削除しました"); });
document.getElementById("gh-sync").addEventListener("click", sync);

/* ---- スマホ: 左端から右へのスワイプで一つ前の画面へ戻る（指に追従し、幅の1/3を超えたら確定） ---- */
(function () {
  let cur = null, sx = 0, sy = 0, dx = 0, active = false;
  function topScreen() {
    // いちばん手前に出ている画面を返す（設定 > 詳細 > タスク一覧）
    if (panel.classList.contains("open")) return { el: panel, back: () => panel.classList.remove("open") };
    if (selectedId) return { el: document.getElementById("detail"), back: () => { selectedId = null; render(); } };
    if (document.body.classList.contains("m-list")) return { el: document.getElementById("main"), back: () => { mobileScreen = "home"; selectedId = null; render(); } };
    return null;
  }
  document.addEventListener("touchstart", e => {
    if (!isMobile()) return;
    const t = e.touches[0]; if (t.clientX > 40) return; // 左端40pxから開始したときだけ
    cur = topScreen(); if (!cur) return;
    sx = t.clientX; sy = t.clientY; dx = 0; active = false;
  }, { passive: true });
  document.addEventListener("touchmove", e => {
    if (!cur) return;
    const t = e.touches[0]; dx = t.clientX - sx; const dy = t.clientY - sy;
    if (!active) {
      if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { cur = null; return; } // 縦スクロールは邪魔しない
      if (dx > 10) active = true; else return;
    }
    cur.el.style.transition = "none"; cur.el.style.transform = `translateX(${Math.max(0, dx)}px)`;
  }, { passive: true });
  document.addEventListener("touchend", () => {
    if (!cur) return;
    const node = cur.el, back = cur.back, ok = active && dx > window.innerWidth / 3;
    node.style.transition = "";
    if (ok) { node.style.transform = "translateX(100%)"; setTimeout(() => { node.style.transform = ""; back(); }, 280); }
    else node.style.transform = "";
    cur = null; active = false;
  });
})();

/* ---- スマホ: 一覧の上端で下に引っ張って離すと同期（Pull to Refresh） ---- */
(function () {
  const THRESH = 64;
  function attach(scrollEl, ptr) {
    let sy = 0, pulling = false, dist = 0;
    scrollEl.addEventListener("touchstart", e => {
      if (!isMobile() || scrollEl.scrollTop > 0 || !cfgOk(getCfg())) { pulling = false; return; }
      sy = e.touches[0].clientY; pulling = true; dist = 0;
    }, { passive: true });
    scrollEl.addEventListener("touchmove", e => {
      if (!pulling) return;
      const dy = e.touches[0].clientY - sy;
      if (dy <= 0 || scrollEl.scrollTop > 0) { ptr.style.height = "0"; return; }
      dist = Math.min(dy / 2, 96);
      ptr.style.transition = "none"; ptr.style.height = dist + "px";
      ptr.classList.toggle("armed", dist >= THRESH);
      ptr.textContent = dist >= THRESH ? "離して同期" : "↓ 引っ張って同期";
    }, { passive: true });
    scrollEl.addEventListener("touchend", async () => {
      if (!pulling) return; pulling = false;
      ptr.style.transition = "";
      if (dist >= THRESH) {
        ptr.classList.add("busy"); ptr.innerHTML = "<span class='spin'></span>同期中…";
        await sync();
        ptr.textContent = statusEl.textContent;
        setTimeout(() => { ptr.classList.remove("busy", "armed"); ptr.style.height = "0"; }, 700);
      } else { ptr.classList.remove("armed"); ptr.style.height = "0"; }
    });
  }
  attach(document.getElementById("nav"), document.getElementById("ptr-side"));
  attach(document.getElementById("tasks-scroll"), document.getElementById("ptr-main"));
})();

// PCは「今日の予定」を開いた状態で起動。スマホはリスト一覧（ホーム）から
mobileScreen = isMobile() ? "home" : "list";
render();
if (cfgOk(getCfg())) { status("設定済み"); sync(); } else { status("未同期（ローカルのみ）。⚙️ 設定から同期とAIを有効化"); }
